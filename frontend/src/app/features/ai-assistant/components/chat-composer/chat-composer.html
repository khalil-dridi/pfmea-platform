<form class="composer" (submit)="$event.preventDefault(); submit()">
  <div class="ai-field composer__field">
    <label class="visually-hidden" for="ai-message-input">Type your message</label>
    <textarea
      id="ai-message-input"
      name="message"
      rows="2"
      [value]="draft()"
      [disabled]="disabled() || sending()"
      placeholder="Type your message..."
      (input)="onInput($event)"
      (keydown)="onKeydown($event)"
    ></textarea>
  </div>
  <button type="submit" class="ai-btn ai-btn--primary" [disabled]="!canSend()">
    @if (sending()) {
      <span class="ai-spinner" aria-hidden="true"></span>
    } @else {
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path
          d="m5 5 14 7-14 7 2.6-7L5 5Z"
          stroke="currentColor"
          stroke-width="1.7"
          stroke-linejoin="round"
        />
        <path d="M7.8 12H19" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
      </svg>
    }
    <span>Send</span>
  </button>
</form>
