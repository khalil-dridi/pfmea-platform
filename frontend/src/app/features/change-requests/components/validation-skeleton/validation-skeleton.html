<div class="validation-skeleton" role="status" aria-live="polite" aria-label="Loading validations">
  @for (item of placeholders; track item) {
    <article class="validation-skeleton__item" aria-hidden="true">
      <span class="validation-skeleton__icon"></span>
      <span class="validation-skeleton__line validation-skeleton__line--title"></span>
      <span class="validation-skeleton__line validation-skeleton__line--meta"></span>
      <span class="validation-skeleton__line validation-skeleton__line--date"></span>
      <span class="validation-skeleton__status"></span>
      <span class="validation-skeleton__button"></span>
      <span class="validation-skeleton__menu"></span>
    </article>
  }
</div>
