<article
  class="process-card"
  [class.process-card--list]="layout() === 'list'"
  [attr.data-accent]="accent()"
  [style.--i]="index()"
>
  <header class="process-card__head">
    <span class="process-card__icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none">
        <rect x="3.8" y="3.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
        <rect x="13.8" y="3.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
        <rect x="8.8" y="13.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
        <path d="M7 10.2v1.4h10v-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
      </svg>
    </span>

    <div class="process-card__identity">
      <h2>{{ process().name }}</h2>
      <span class="process-card__number">Process #{{ process().processNumber }}</span>
    </div>

    <div class="process-card__menu">
      <button
        type="button"
        class="process-card__menu-btn"
        [attr.aria-expanded]="menuOpen()"
        aria-haspopup="menu"
        [attr.aria-label]="'More actions for ' + process().name"
        (click)="toggleMenu($event)"
      >
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="6" r="1.45" />
          <circle cx="12" cy="12" r="1.45" />
          <circle cx="12" cy="18" r="1.45" />
        </svg>
      </button>

      @if (menuOpen()) {
        <div class="process-card__dropdown" role="menu" (click)="$event.stopPropagation()">
          <a role="menuitem" [routerLink]="viewLink()" (click)="closeMenu()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3.8 12s2.8-6.2 8.2-6.2S20.2 12 20.2 12s-2.8 6.2-8.2 6.2S3.8 12 3.8 12Z" stroke="currentColor" stroke-width="1.7" />
              <circle cx="12" cy="12" r="2.3" stroke="currentColor" stroke-width="1.7" />
            </svg>
            View
          </a>
          <a role="menuitem" [routerLink]="editLink()" (click)="closeMenu()">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M5 16.8V19h2.2L17.6 8.6l-2.2-2.2L5 16.8Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" />
              <path d="m14.2 7.6 2.2 2.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
            </svg>
            Edit
          </a>
        </div>
      }
    </div>
  </header>

  <a
    class="process-card__workspace"
    [routerLink]="workspaceLink()"
    [attr.aria-label]="'Open workspace for ' + process().name"
  >
    Open Workspace
    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M5 12h13M13.5 6.5 19 12l-5.5 5.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </a>
</article>
