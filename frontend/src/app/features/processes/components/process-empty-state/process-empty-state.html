<div class="process-empty" role="status">
  <span class="process-empty__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <rect x="3.8" y="3.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
      <rect x="13.8" y="3.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
      <rect x="8.8" y="13.8" width="6.4" height="6.4" rx="1.3" stroke="currentColor" stroke-width="1.7" />
      <path d="M7 10.2v1.4h10v-1.4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </span>
  <h2>No processes found</h2>
  <p>
    @if (filtered()) {
      No processes match your search.
    } @else {
      Create your first production process to get started.
    }
  </p>
  @if (filtered()) {
    <button type="button" class="btn btn--ghost" (click)="clearSearch.emit()">Clear Search</button>
  } @else {
    <a routerLink="/processes/create" class="btn btn--primary">+ New Process</a>
  }
</div>
