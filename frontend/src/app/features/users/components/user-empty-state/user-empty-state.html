<div class="user-empty" role="status">
  <span class="user-empty__icon" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none">
      <circle cx="9" cy="8.5" r="2.7" stroke="currentColor" stroke-width="1.7" />
      <circle cx="16.5" cy="9.2" r="2.2" stroke="currentColor" stroke-width="1.7" />
      <path d="M3.8 18.5c.9-2.8 2.7-4.2 5.2-4.2s4.3 1.4 5.2 4.2M14 14.6c1.7-.2 3.2.7 4.2 2.9" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" />
    </svg>
  </span>
  <h2>No users found</h2>
  <p>
    @if (filtered()) {
      No user accounts match your current filters.
    } @else {
      No user accounts are available yet.
    }
  </p>
  @if (filtered()) {
    <button type="button" class="btn btn--ghost" (click)="clearFilters.emit()">Clear filters</button>
  }
</div>
