<div
  class="app-layout"
  [class.app-layout--collapsed]="isCollapsed()"
  [class.app-layout--mobile-open]="isMobileOpen()"
>
  <app-sidebar
    [collapsed]="isCollapsed()"
    [mobileOpen]="isMobileOpen()"
    (navigated)="closeMobileSidebar()"
  />

  @if (isMobileOpen()) {
    <button
      type="button"
      class="app-layout__backdrop"
      aria-label="Fermer le menu"
      (click)="closeMobileSidebar()"
    ></button>
  }

  <div class="app-main">
    <app-navbar
      [collapsed]="isCollapsed()"
      [mobileOpen]="isMobileOpen()"
      (sidebarToggle)="toggleSidebar()"
    />

    <main class="app-content">
      <router-outlet />
    </main>
  </div>
</div>
